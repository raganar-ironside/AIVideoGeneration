name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Blender
        run: sudo apt-get update && sudo apt-get install -y ffmpeg blender
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test real headless Blender rendering
        run: python scripts/blender_2d_demo.py --duration 0.25 --output-dir /tmp/blender-2d-smoke
