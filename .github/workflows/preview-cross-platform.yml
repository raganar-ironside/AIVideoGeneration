name: Preview cross-platform checks

on:
  pull_request:
  push:
    branches:
      - feature/cross-platform-preview-review

jobs:
  preview-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Preview unit tests
        run: python -m pytest -q tests/test_render_preview.py tests/test_preview_approval.py
      - name: Compile changed Python files
        run: python -m compileall -q src/historyforgeai/render_preview.py src/historyforgeai/application/services/preview_approval.py src/historyforgeai/application/services/render_job.py src/historyforgeai/infrastructure/rendering/blender_2d.py src/historyforgeai/interfaces/storyboard_app.py src/historyforgeai/cli.py
