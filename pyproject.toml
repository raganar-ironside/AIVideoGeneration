[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "historyforgeai"
version = "0.1.0"
description = "Modular Indian-history documentary Shorts pipeline"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "requests>=2.31,<3", "Pillow>=10,<13", "python-dotenv>=1,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]
review = ["streamlit>=1.36,<2"]
images = ["huggingface_hub>=0.30,<2"]
kokoro = ["kokoro-onnx>=0.4", "soundfile>=0.12"]
edge = ["edge-tts>=6.1"]
[project.scripts]
historyforgeai = "historyforgeai.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
